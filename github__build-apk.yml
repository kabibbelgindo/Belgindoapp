name: Build Belgindo Inventory APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'android-webview/**'
      - 'web/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy latest web assets into APK assets
        run: |
          rm -rf android-webview/app/src/main/assets/*
          cp -r web/* android-webview/app/src/main/assets/

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android-webview/local.properties

      - name: Decode keystore (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android-webview/belgindo.keystore
          echo "storeFile=belgindo.keystore" >> android-webview/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android-webview/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android-webview/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android-webview/keystore.properties

      - name: Build debug APK (always)
        working-directory: android-webview
        run: |
          chmod +x gradlew || true
          # Generate gradle wrapper if missing
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2
          fi
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BelgindoInventory-debug
          path: android-webview/app/build/outputs/apk/debug/*.apk

      - name: Build release APK (if keystore present)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: android-webview
        run: |
          # Inject signing config into app/build.gradle if keystore exists
          ./gradlew assembleRelease --stacktrace || true

      - name: Upload release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: BelgindoInventory-release
          path: android-webview/app/build/outputs/apk/release/*.apk
